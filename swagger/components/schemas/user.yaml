type: object
required:
  - _id
  - name
  - email
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  email:
    description: "User's email"
    type: string
    example: exmple@gmail.com
