type: object
required:
  - _id
  - name
  - phoneNumber
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: +380345678900
  userId:
    description: 'Id of a user who created contact'
  email:
    description: "Contact's email"
    type: string
    example: exmple@gmail.com
  isFavourite:
    description: 'Marks if contact is favoured'
    type: boolean
    example: true
  contactType:
    description: 'Type of phone used by contact'
    type: string
    enum: ['home', 'personal', 'work']
    example: home
  photo:
    description: "Link to student's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
